name: Patch club and CEAS
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_club_ceas.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Añadir días de Club de ocio y detalles CEAS"
          git push
      - run: rm -f patch_club_ceas.py .patch-trigger .github/workflows/patch-club-ceas.yml
        if: always()
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Retirar archivos temporales de actualización"
          git push
        if: always()
