name: PDF pagination fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove repeated PDF header on continuation pages
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = "if(y+h>bottom){d.addPage();pdfHeader(d,'', '');y=24}"
          new = "if(y+h>bottom){d.addPage();y=14}"
          if old not in s:
              print('Pattern not found; nothing to change')
              raise SystemExit(0)
          p.write_text(s.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "PDF: solo encabezado en la primera página"
          git push
